# docker-compose.yml
# Local infra for the Node.js Microservices course.
# MongoDB is intentionally NOT here — using MongoDB Atlas (cloud), see .env.example.
services:
  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-7379}:6379"
    restart: unless-stopped
    networks:
      - microservices-net

  # Dockerized alternative to the course's `npm install -g redis-commander`.
  # Optional — only starts with: docker compose --profile tools up
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - microservices-net
    profiles:
      - tools

  jaeger:
    image: jaegertracing/all-in-one:1.45
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"       # UI: http://localhost:16686
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"  # OTLP gRPC
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"  # OTLP HTTP
    restart: unless-stopped
    networks:
      - microservices-net

  rabbitmq:
    image: rabbitmq:4.2-management
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-admin}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"    # AMQP
      - "${RABBITMQ_UI_PORT:-15672}:15672"    # Management UI (admin/admin)
    restart: unless-stopped
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  microservices-net:
    name: ${COMPOSE_PROJECT_NAME:-ms-course}-net